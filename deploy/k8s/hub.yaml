# A sketch of the hub on Kubernetes. NOT YET APPLIED OR RUN. Replace the placeholders.
# The hub needs: its private identity and the agents' public bundles (mounted from a secret and a config map),
# the bot token (a secret), and Pub/Sub access through workload identity (no key file).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: petrvs-bridge-hub
  annotations:
    iam.gke.io/gcp-service-account: HUB_SA@PROJECT.iam.gserviceaccount.com   # workload identity
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petrvs-bridge-hub
spec:
  replicas: 1                      # two hubs would fight over one bot
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: petrvs-bridge-hub}
  template:
    metadata:
      labels: {app: petrvs-bridge-hub}
    spec:
      serviceAccountName: petrvs-bridge-hub
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532                 # lets the non-root user read the mounted secret (mode 0440 below)
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: hub
          image: REGISTRY/petrvs-bridge-hub@sha256:DIGEST
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - {name: PB_PROJECT, value: PROJECT}
            - {name: PB_PREFIX, value: pb}
            - {name: PB_IDENTITY, value: /keys/hub.identity.json}
            - {name: PB_AGENTS_DIR, value: /agents}
            - {name: PB_CHAT_ID, value: "CHAT_ID"}
            - {name: PB_ALLOW_GROUP_READ, value: "true"}      # the secret volume is group-readable because of fsGroup
            - {name: PB_LOCK_FILE, value: /state/lockdown}    # survives a container restart, not a deleted pod
            - name: TELEGRAM_BOT_TOKEN
              valueFrom: {secretKeyRef: {name: petrvs-bridge-bot, key: token}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 100m, memory: 128Mi}
          volumeMounts:
            - {name: keys, mountPath: /keys, readOnly: true}
            - {name: agents, mountPath: /agents, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - name: state
          emptyDir: {sizeLimit: 1Mi}
        - name: keys
          secret: {secretName: petrvs-bridge-hub-identity, defaultMode: 0440}
        - name: agents
          configMap: {name: petrvs-bridge-agents}
---
# Only outbound traffic to Telegram and Google APIs is needed; nothing listens.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: petrvs-bridge-hub
spec:
  podSelector:
    matchLabels: {app: petrvs-bridge-hub}
  policyTypes: [Ingress, Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
