# Values for the hub. NOT YET INSTALLED ON A CLUSTER: check `helm lint` and `helm template` output before you use it.
# Secrets never go into these values: the bot token and the hub's private identity are read from Kubernetes Secrets
# that you create yourself (see NOTES.txt after an install).

image:
  repository: ""        # for example REGION-docker.pkg.dev/PROJECT/REPOSITORY/petrvs-bridge-hub
  digest: ""            # sha256:..., preferred: an immutable reference
  tag: ""               # used when no digest is given; there is no default, and latest, local and dev are refused
  pullPolicy: IfNotPresent
imagePullSecrets: []

pubsub:
  project: ""           # required: the Google Cloud project that holds the topics and subscriptions
  prefix: pb            # the resources are called PREFIX-to-hub, PREFIX-hub, PREFIX-to-agent-NAME, PREFIX-agent-NAME

hub:
  # Both ids must be QUOTED strings, for example "123456789", or "-1001234567890" for a group: a bare number in a values
  # file becomes a float and would be rendered as 1.23456789e+08 (values.schema.json refuses it). With --set use --set-string.
  chatId: ""            # required: the only chat that is obeyed
  userId: ""            # the only user that is obeyed; empty means the chat id
  defaultAgent: ""      # the agent that gets plain text until you choose one; empty: the hub asks first when it has several
  deliveredReaction: "👀" # put on your message once the agent has got it and typed it into its session; "off" for no mark
  failedReaction: "👎"    # put on your message when it did not get through (agent offline, bus refused, agent could not type it); "off" for none
  receivedReaction: "off" # an early mark, put as soon as the hub has read your message and before the agent has; "off" for none
  logLevel: info
  offlineAfter: ""      # for example 3m; empty keeps the program's default
  textTTL: ""           # 10m by default
  keyTTL: ""            # 1m by default
  maxReplyBytes: ""
  extraEnv: []          # more environment variables, in the Kubernetes {name, value} form

# Where the hub keeps its lockdown (/lockdown): a file of a few bytes. On an emptyDir (the default) it survives a restarted
# container but not a new pod, and the new hub then starts unlocked without saying so. With persistence it is kept on a
# PersistentVolumeClaim (ReadWriteOnce; the Recreate strategy makes sure two pods never hold it at once).
state:
  persistence:
    enabled: false
    size: 1Gi           # a cloud disk has a smallest size (10Gi for pd-balanced); the chart asks for what you write
    storageClassName: ""  # empty: the cluster's default class

secrets:
  botToken:
    secretName: petrvs-bridge-bot            # a Secret with the bot token under the key below
    key: token
    externalSecret:
      remoteKey: ""     # set: an ExternalSecret (below) makes that Secret from this entry of the secret store, so nobody creates it by hand
  identity:
    secretName: petrvs-bridge-hub-identity   # a Secret that holds the hub's private identity file
    fileName: hub.identity.json
    externalSecret:
      remoteKey: ""     # set: the same for the identity file (its content is the value of the entry)

# Used by the ExternalSecrets above (the External Secrets Operator must be installed). The chart never holds a secret value.
externalSecrets:
  secretStore:
    kind: ClusterSecretStore
    name: ""            # required when a remoteKey is set
  refreshInterval: 1h

agents:
  # The agents that may connect: one NAME.pub.json per agent (public bundles, not secret). Either give them here ...
  # (every key must be called NAME.pub.json: the hub reads only *.pub.json files; values.schema.json checks it)
  files: {}
  #   laptop.pub.json: |
  #     {...}
  # ... or point at a ConfigMap that you manage yourself (then `files` is ignored).
  existingConfigMap: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}       # on GKE with Workload Identity: iam.gke.io/gcp-service-account: HUB_SA@PROJECT.iam.gserviceaccount.com

podAnnotations: {}
podLabels: {}
resources:
  requests: {cpu: 50m, memory: 64Mi}
  limits: {cpu: 100m, memory: 128Mi}
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  # Outbound HTTPS and DNS to any address by default. false: HTTPS not to the private, link-local and shared ranges (10/8,
  # 172.16/12, 192.168/16, 169.254/16, 100.64/10) and DNS only to kube-dns and the node's DNS cache (169.254.20.10), so the pod
  # can reach Telegram and Google but nothing inside the cluster or the VPC. Keep true if Google APIs are reached through a
  # private endpoint (Private Service Connect), or if the cluster's DNS is not kube-dns.
  allowPrivateRanges: true
  # true: the chart also makes the policies of the whole namespace, `default-deny` (nothing in or out for any pod that no other policy opens) and
  # `allow-dns` (DNS for every pod, to kube-dns and the node's DNS cache), so that a pod of no release, such as a debugging pod, can talk to nothing.
  # Their names are fixed: turn it on in one release per namespace.
  namespaceDefaultDeny: false
  # Only outbound traffic is needed (Telegram and Google APIs, DNS); nothing listens. Further egress rules go here.
  extraEgress: []
  # GKE Workload Identity reaches Google through a metadata server on the node. With a network policy that server has to
  # be allowed explicitly: 169.254.169.252:988 (and 169.254.169.254:80 on Dataplane V2). Turn this off elsewhere.
  allowGKEMetadataServer: true
