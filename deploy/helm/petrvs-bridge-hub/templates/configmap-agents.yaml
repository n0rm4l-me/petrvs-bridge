{{- if and (not .Values.agents.existingConfigMap) .Values.agents.files }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hub.agentsConfigMap" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
data:
  {{- range $file, $content := .Values.agents.files }}
  {{ $file }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- end }}
