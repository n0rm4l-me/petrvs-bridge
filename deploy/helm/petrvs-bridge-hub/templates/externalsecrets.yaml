{{- /* The Secrets the hub reads, made from entries of a secret store by the External Secrets Operator. Only the names of the
entries are here; a person puts the values in the store. Rendered only for an entry that has a remoteKey. */ -}}
{{- $store := .Values.externalSecrets.secretStore -}}
{{- $kind := .Values.hub.chat | default "telegram" -}}
{{- $list := list (dict "key" .Values.secrets.identity.fileName "s" .Values.secrets.identity) -}}
{{- if eq $kind "slack" -}}
{{- $list = concat $list (list (dict "key" .Values.secrets.slackBotToken.key "s" .Values.secrets.slackBotToken) (dict "key" .Values.secrets.slackAppToken.key "s" .Values.secrets.slackAppToken)) -}}
{{- else -}}
{{- $list = concat $list (list (dict "key" .Values.secrets.botToken.key "s" .Values.secrets.botToken)) -}}
{{- end -}}
{{- range $e := $list }}
{{- if $e.s.externalSecret.remoteKey }}
{{- if not $store.name }}{{ fail "externalSecrets.secretStore.name is required when an externalSecret.remoteKey is set" }}{{ end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $e.s.secretName }}
  labels:
    {{- include "hub.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $store.kind }}
    name: {{ $store.name }}
  target:
    name: {{ $e.s.secretName }}
    creationPolicy: Owner      # the Secret belongs to this ExternalSecret and goes with it
  data:
    - secretKey: {{ $e.key }}
      remoteRef:
        key: {{ $e.s.externalSecret.remoteKey }}
{{- end }}
{{- end }}
