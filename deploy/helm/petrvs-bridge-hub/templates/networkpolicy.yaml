{{- if .Values.networkPolicy.enabled }}
# Only outbound traffic is needed; nothing listens.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "hub.fullname" . }}
  labels:
    {{- include "hub.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "hub.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  egress:
    - ports:
        - {protocol: TCP, port: 443}
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- if .Values.networkPolicy.allowGKEMetadataServer }}
    - to:
        - ipBlock: {cidr: 169.254.169.252/32}
      ports:
        - {protocol: TCP, port: 988}
    - to:
        - ipBlock: {cidr: 169.254.169.254/32}
      ports:
        - {protocol: TCP, port: 80}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
