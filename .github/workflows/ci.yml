# The pipeline, stage by stage. A stage starts when the ones it needs have passed:
#
#   1 Static checks -> 2 Build (four platforms) + Hub image -> 3 Tests (unit, end to end, smoke, fuzz)
#                   -> 4 Known vulnerabilities + 5 Deploy files -> 6 All checks passed
#
# The tests that need the Pub/Sub emulator are skipped here (no PUBSUB_EMULATOR_HOST); run `make test-emulator` locally.
# Every action is pinned by the commit of a release, with the release in the comment.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------- 1
  static:
    name: 1 Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: The modules are what go.sum says
        run: go mod verify
      - name: shellcheck (examples and scripts)
        run: shellcheck -S warning examples/*.sh scripts/*.sh

  # ---------------------------------------------------------------- 2
  build:
    name: 2 Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64}
          - {goos: linux, goarch: arm64}
          - {goos: darwin, goarch: arm64}
          - {goos: darwin, goarch: amd64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build hub, agent and bridgekeys
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags="-s -w" -o "dist/${GOOS}-${GOARCH}/" ./cmd/...
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: petrvs-bridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  image:
    name: 2 Hub image
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build deploy/hub.Dockerfile (nothing is pushed)
        run: docker build -f deploy/hub.Dockerfile -t petrvs-bridge-hub:ci .

  # ---------------------------------------------------------------- 3
  unit:
    name: 3 Unit tests
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: go test -race (every package except the end-to-end and smoke ones)
        run: |
          mapfile -t packages < <(go list ./... | grep -v -e '/internal/e2e$' -e '/internal/smoke$')
          go test -race -count=1 "${packages[@]}"

  e2e:
    name: 3 End-to-end tests
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: go test -race ./internal/e2e (hub and agents on an in-memory bus)
        run: go test -race -count=1 -timeout 30m ./internal/e2e

  smoke:
    name: 3 Smoke test (real binaries, real tmux)
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - name: go test -race ./internal/smoke
        run: go test -race -count=1 ./internal/smoke

  fuzz:
    name: 3 Fuzz the ratchet (30 s)
    needs: [build, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Fuzz Decrypt
        run: go test -run xxx -fuzz FuzzDecrypt -fuzztime 30s ./internal/ratchet/

  # ---------------------------------------------------------------- 4
  vulnerabilities:
    name: 4 Known vulnerabilities
    needs: [unit, e2e, smoke, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: govulncheck (the code paths this program uses)
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  # ---------------------------------------------------------------- 5
  deploy-files:
    name: 5 Deploy files
    needs: [unit, e2e, smoke, fuzz]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.1.3
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.5.7
          terraform_wrapper: false
      - name: Helm chart lints and renders (Telegram and Slack)
        run: |
          chart=deploy/helm/petrvs-bridge-hub
          common=(
            --set pubsub.project=demo
            --set agents.existingConfigMap=agents
            --set image.repository=example.invalid/petrvs-bridge-hub
            --set image.tag=v0.0.1
          )
          helm lint "$chart" "${common[@]}" --set-string hub.chatId=1
          helm template t "$chart" "${common[@]}" --set-string hub.chatId=1 > /dev/null
          helm template t "$chart" "${common[@]}" --set hub.chat=slack --set-string slack.userId=U0123ABCD > /dev/null
      - name: Terraform of the cloud side is formatted and valid
        working-directory: deploy/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - name: The Slack app manifest is what the hub prints
        run: go run ./cmd/hub slack-manifest | diff - deploy/slack/manifest.json

  # ---------------------------------------------------------------- 6
  passed:
    name: 6 All checks passed
    if: ${{ always() }}
    needs: [static, build, image, unit, e2e, smoke, fuzz, vulnerabilities, deploy-files]
    runs-on: ubuntu-latest
    steps:
      - name: Every stage succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "results of the stages: $results"
          case " $results " in
            *" failure "* | *" cancelled "* | *" skipped "*) exit 1 ;;
          esac
